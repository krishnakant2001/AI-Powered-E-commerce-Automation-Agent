spring.application.name=payment-service

server.port=0

# In-memory database (H2) instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Placeholders referenced by src/main/resources/application.properties
DB_USERNAME=sa
DB_PASSWORD=

# Razorpay credentials. They are never used against the real gateway: every test either mocks
# the RazorpayClient or signs its own payloads with exactly these secrets.
razorpay.key.id=rzp_test_dummykey
razorpay.key.secret=dummysecret
razorpay.webhook.key.secret=dummywebhooksecret

# Service discovery must stay off during the tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# No broker is running during the tests: never create a topic and never block on metadata
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=1s
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.properties.request.timeout.ms=1000
spring.kafka.properties.default.api.timeout.ms=1000

logging.level.root=WARN
logging.level.com.strikerkk.aicommerce.payment_service=INFO

