spring.application.name=cart-service

server.port=0

# In-memory database (H2) instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:cartdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Placeholders referenced by src/main/resources/application.properties
DB_USERNAME=sa
DB_PASSWORD=

# Service discovery must stay off during the tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

logging.level.root=WARN
logging.level.com.strikerkk.aicommerce.cart_service=INFO

