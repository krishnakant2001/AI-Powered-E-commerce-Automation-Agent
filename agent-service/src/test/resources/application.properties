spring.application.name=agent-service

server.port=0

# In-memory database (H2) instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:agentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Placeholders referenced by src/main/resources/application.properties
DB_USERNAME=sa
DB_PASSWORD=
ANTHROPIC_URL=http://localhost:1/not-called
ANTHROPIC_API_KEY=test-api-key

# Redis - never actually contacted, Lettuce connects lazily and every test
# either mocks the RedisTemplate or replaces it with an in-memory double.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

agent.session.ttl-minutes=60

# LLM - the real endpoint is never reached, tests point this at a local stub
anthropic.url=http://localhost:1/not-called
anthropic.api.key=test-api-key
anthropic.api.model=claude-sonnet-4-5
anthropic.api.max-tokens=1000

# Service discovery must stay off during the tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

logging.level.root=WARN
logging.level.com.strikerkk.aicommerce.agent_service=INFO

