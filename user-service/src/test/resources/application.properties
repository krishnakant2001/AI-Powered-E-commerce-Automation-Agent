spring.application.name=user-service

# Servlet
server.servlet.context-path=

# In-memory database (H2) instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:userdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT signing key - must be >= 256 bits for the HS256 algorithm used by JwtService
jwt.secretKey=user-service-test-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz

# Placeholders referenced by src/main/resources/application.yml (Google OAuth2)
GOOGLE_CLIENT_ID=test-google-client-id
GOOGLE_CLIENT_SECRET=test-google-client-secret

# Placeholders referenced by src/main/resources/application.properties
DB_USERNAME=sa
DB_PASSWORD=
JWT_SECRET_KEY=user-service-test-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz

# Service discovery must stay off during tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

logging.level.root=WARN
logging.level.com.strikerkk.aicommerce.user_service=INFO

