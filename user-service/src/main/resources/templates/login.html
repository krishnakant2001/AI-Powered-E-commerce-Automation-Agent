<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Sign in to AI-Commerce — smart shopping powered by AI.">

    <title>AI-Commerce - Login</title>

    <link rel="stylesheet" href="/api/v1/users/css/style.css">
</head>

<body>

<div class="page">

    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            <div class="cart-icon" role="img" aria-label="AI-Commerce logo">AI</div>
        </div>

        <h1>AI-Commerce</h1>

        <p class="tagline">
            Smart Shopping. Powered by AI.
        </p>

        <!-- Shopping illustration -->
        <div class="shopping-area" aria-hidden="true">
            <div class="cart">
                🛒
            </div>
        </div>

        <!-- Login box -->
        <div class="login-box">

            <h2>Welcome to AI-Commerce</h2>

            <p>
                Sign in with Google to explore
                the future of smart shopping.
            </p>

            <a href="/oauth2/authorization/google"
               class="google-button"
               role="button">

                <img src="/api/v1/users/css/search.png"
                     class="google-icon"
                     alt=""
                     aria-hidden="true"
                     width="24"
                     height="24">

                <span>Continue with Google</span>

            </a>

            <p class="secure-text">
                <span aria-hidden="true">🔒</span>
                Secure, private and personalized for you.
            </p>

        </div>

    </div>

</div>

</body>
</html>
