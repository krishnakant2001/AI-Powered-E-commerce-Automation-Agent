name: CI/CD - Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'


# =========================================================
# 1. BUILD
# =========================================================
jobs:
  build:
    name: Build / ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - agent-service
          - api-gateway
          - cart-service
          - discovery-server
          - order-service
          - payment-service
          - product-service
          - user-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile
        working-directory: ${{ matrix.service }}
        run: mvn -B test-compile


  # =========================================================
  # 2. TEST
  # =========================================================
  test:
    name: Test / ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - agent-service
          - api-gateway
          - cart-service
          - discovery-server
          - order-service
          - payment-service
          - product-service
          - user-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports


  # =========================================================
  # 3. PACKAGE
  # =========================================================
  package:
    name: Package / ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - agent-service
          - api-gateway
          - cart-service
          - discovery-server
          - order-service
          - payment-service
          - product-service
          - user-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Package JAR
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Validate build
        run: ls -lh ${{ matrix.service }}/target

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar


  # =========================================================
  # 4. DOCKER BUILD + SECURITY SCAN + PUSH
  # =========================================================
  docker:
    name: Docker Build Image / ${{ matrix.service }}
    needs: package
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - agent-service
          - api-gateway
          - cart-service
          - discovery-server
          - order-service
          - payment-service
          - product-service
          - user-service

    steps:
      - uses: actions/checkout@v5

      # Download JAR
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target

      - uses: docker/setup-buildx-action@v3

      # Build image locally (NO PUSH YET)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: local/${{ matrix.service }}:scan

      # Security scan (fails the job on fixable CRITICAL/HIGH)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      # Only reached if the scan passed
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push image to docker hub
      - name: Tag and push
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
        run: |
          DATE_TAG=$(date +%Y%m%d)
          for TAG in "$DATE_TAG" "${{ github.sha }}" latest; do
            docker tag local/${{ matrix.service }}:scan "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done