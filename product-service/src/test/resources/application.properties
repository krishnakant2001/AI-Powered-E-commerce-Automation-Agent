spring.application.name=product-service

server.port=0

# In-memory database (H2) instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:productdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Placeholders referenced by src/main/resources/application.properties
DB_USERNAME=sa
DB_PASSWORD=

# Service discovery must stay off during the tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# Kafka: the listener containers must never try to reach a broker
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.auto-offset-reset=earliest

# AWS / S3 placeholders referenced by S3Config and S3ImageService
aws.region=ap-south-1
aws.s3.bucket-name=test-bucket
aws.accessKeyId=test-access-key
aws.secretAccessKey=test-secret-key

logging.level.root=WARN
logging.level.com.strikerkk.aicommerce.product_service=INFO

